<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="geometricPrecision">
  <!-- The toolbar-size bookworm: head, spectacles, bowtie, and a slice of book.
       Drawn for 16 pixels rather than shrunk from the large one. -->
  <!-- Book -->
  <path d="M1 12.2 L8 13.4 L15 12.2 L15 15 L8 15.9 L1 15 Z" fill="#c9442a"/>
  <path d="M1.8 11.4 L8 12.6 L14.2 11.4 L14.2 13.6 L8 14.8 L1.8 13.6 Z" fill="#fff8ec" stroke="#23202a" stroke-width="0.8" stroke-linejoin="round"/>
  <!-- Body stub -->
  <path d="M7.4 12.4 L7.4 9" stroke="#23202a" stroke-width="4" stroke-linecap="round"/>
  <path d="M7.4 12.4 L7.4 9" stroke="#86c94f" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Head -->
  <circle cx="8.6" cy="5.1" r="4.3" fill="#86c94f" stroke="#23202a" stroke-width="1"/>
  <!-- Spectacles as two dark eyes with white rims -->
  <circle cx="7.1" cy="4.7" r="1.35" fill="#fff" stroke="#23202a" stroke-width="0.7"/>
  <circle cx="10.2" cy="4.7" r="1.35" fill="#fff" stroke="#23202a" stroke-width="0.7"/>
  <circle cx="7.3" cy="4.8" r="0.6" fill="#23202a"/>
  <circle cx="10.4" cy="4.8" r="0.6" fill="#23202a"/>
  <!-- Bowtie -->
  <path d="M8.3 9.7 L4.6 8 L4.6 11.4 Z M8.3 9.7 L12 8 L12 11.4 Z" fill="#e0492a" stroke="#23202a" stroke-width="0.7" stroke-linejoin="round"/>
  <circle cx="8.3" cy="9.7" r="0.9" fill="#b5341a" stroke="#23202a" stroke-width="0.5"/>
</svg>
