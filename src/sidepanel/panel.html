<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>FactCheck</title>
    <style>
      /* Colors live in variables so light/dark can't be broken by rule order. */
      :root {
        color-scheme: light dark;
        --bg: #faf9f7;
        --fg: #1c1b19;
        --card: #ffffff;
        --border: #e5e2db;
        --muted: #6b675f;
        --link: #2f6ea8;
        --accent-soft: rgba(200, 150, 62, 0.16);
        --ok-soft: rgba(61, 122, 90, 0.18);
        --flat-soft: rgba(154, 154, 154, 0.2);
        --cold: #b4462d;
        --warm: #c8963e;
        --hot: #3d7a5a;
        --lean-left: rgba(66, 120, 190, 0.18);
        --lean-center: rgba(150, 150, 150, 0.18);
        --lean-right: rgba(190, 80, 70, 0.18);
        --rating-false: rgba(180, 70, 45, 0.22);
        --rating-true: rgba(61, 122, 90, 0.22);
        --rating-mixed: rgba(200, 150, 62, 0.25);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16150f;
          --fg: #ece9e2;
          --card: #1f1e17;
          --border: #33312a;
          --muted: #a8a49a;
          --link: #7fb0dd;
          --accent-soft: rgba(200, 150, 62, 0.22);
          --ok-soft: rgba(127, 183, 154, 0.22);
          --flat-soft: rgba(200, 200, 200, 0.16);
          --cold: #d4694f;
          --warm: #d8ab55;
          --hot: #6aa88a;
          --lean-left: rgba(110, 160, 220, 0.22);
          --lean-center: rgba(180, 180, 180, 0.2);
          --lean-right: rgba(220, 120, 110, 0.22);
          --rating-false: rgba(212, 105, 79, 0.3);
          --rating-true: rgba(106, 168, 138, 0.3);
          --rating-mixed: rgba(216, 171, 85, 0.3);
        }
      }
      body {
        margin: 0;
        font: var(--fc-panel-size, 13px)/1.5 system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      header {
        position: sticky; top: 0;
        display: flex; align-items: center; justify-content: space-between;
        gap: 8px; padding: 10px 12px;
        background: var(--card); color: var(--fg);
        border-bottom: 1px solid var(--border);
      }
      h1 { font-size: 13px; margin: 0; letter-spacing: 0.01em; color: var(--fg); }
      .toggle { display: flex; align-items: center; gap: 6px; font-size: 12px; }
      main { padding: 10px 12px 24px; }
      /* Thumbs up / thumbs down: always scan this site, or never. */
      .siterow {
        display: flex; align-items: center; gap: 6px;
        padding: 6px 12px; font-size: 12px;
        background: var(--card); color: var(--fg); border-bottom: 1px solid var(--border);
      }
      .site-name { flex: 1; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .thumb {
        font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
        padding: 3px 8px; border-radius: 6px;
        border: 1px solid var(--border); background: transparent; color: var(--fg);
      }
      .thumb:hover { background: var(--accent-soft); }
      .thumb.active { background: var(--accent-soft); border-color: var(--warm); }
      /* Why nothing is being detected, when that has a cause the viewer can act on. */
      .banner {
        padding: 8px 12px; font-size: 12px; line-height: 1.45;
        background: var(--accent-soft); color: var(--fg);
        border-bottom: 1px solid var(--border);
      }
      /* Find bar: step through highlighted claims the way Ctrl+F steps matches. */
      .findbar {
        position: sticky; top: 37px; z-index: 2;
        display: flex; align-items: center; gap: 6px;
        padding: 6px 12px; font-size: 12px;
        background: var(--card); color: var(--fg);
        border-bottom: 1px solid var(--border);
      }
      .findbar button {
        font: inherit; font-size: 11px; line-height: 1; cursor: pointer;
        padding: 4px 8px; border-radius: 5px;
        border: 1px solid var(--border); background: transparent; color: var(--fg);
      }
      .findbar button:hover:not(:disabled) { background: var(--accent-soft); }
      .findbar button:disabled { opacity: 0.4; cursor: default; }
      #counter { font-variant-numeric: tabular-nums; }
      .findhint { color: var(--muted); }
      .claim {
        background: var(--card); color: var(--fg);
        border: 1px solid var(--border); border-radius: 8px;
        padding: 10px; margin-bottom: 10px;
      }
      .claim.fc-focused { outline: 2px solid #c8963e; }
      /* A faint flag: dashed and dimmed, the same card with the same buttons. */
      .claim.faint { border-style: dashed; opacity: 0.72; }
      .claim.faint:hover, .claim.faint.fc-focused { opacity: 1; }
      .faint-tag { font-style: italic; }
      .claim-text { font-weight: 500; cursor: pointer; color: var(--fg); }
      .meta { display: flex; gap: 8px; align-items: center; margin-top: 6px; font-size: 11px; color: var(--muted); }
      .badge { padding: 1px 6px; border-radius: 99px; background: var(--accent-soft); color: var(--fg); }
      .badge.checked { background: var(--ok-soft); }
      .badge.error, .badge.noKey { background: var(--flat-soft); }
      .summary {
        margin-top: 8px; padding: 8px; border-radius: 6px;
        background: var(--accent-soft); color: var(--fg); font-size: 12px;
      }
      .result { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
      .result a { color: var(--link); text-decoration: none; font-weight: 500; }
      .result a:hover { text-decoration: underline; }
      .result .src { font-size: 11px; color: var(--muted); }
      .result .snip { font-size: 12px; color: var(--fg); opacity: 0.85; margin-top: 2px; }
      .result .age { font-size: 11px; color: var(--muted); margin-top: 2px; font-style: italic; }
      .result .figures { font-size: 12px; color: var(--fg); margin-top: 3px; padding: 3px 6px; border-left: 2px solid var(--rating-mixed, var(--muted)); }
      .empty { color: var(--muted); padding: 24px 4px; text-align: center; }
      .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
      /* The style sits beside the button that uses it, so the choice is made where
         the citation is taken rather than in a settings page. */
      .cite-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
      /* What the AI said about a citation, including that it found nothing. */
      .keep-note { font-size: 11px; color: var(--muted); }
      .keep-note.refused { color: var(--fg); }
      .ai-note:empty { display: none; }
      .ai-note { font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.4; }
      .ai-note.warn { color: var(--fg); border-left: 2px solid var(--rating-mixed, var(--muted)); padding-left: 6px; }
      select.cite-format {
        font: inherit; font-size: 11px; padding: 3px 4px; border-radius: 5px;
        border: 1px solid var(--border); background: var(--bg); color: var(--fg);
      }
      .muted-note { font-size: 12px; color: var(--muted); font-style: italic; }
      /* What the model noticed in the sentence. Quiet, because it explains the
         highlight rather than competing with it. */
      .signals { margin-top: 4px; font-size: 11px; color: var(--muted); }
      button.check {
        padding: 5px 12px; font: inherit; font-size: 12px; font-weight: 500;
        cursor: pointer; border-radius: 6px;
        border: 1px solid var(--border); background: var(--accent-soft); color: var(--fg);
      }
      button.check.secondary { background: transparent; }

      /* Truth thermometer: how far the sources go toward supporting the claim. */
      .analysis { margin-top: 10px; }
      .verdict { font-weight: 600; font-size: 12px; display: flex; justify-content: space-between; gap: 8px; }
      .confidence { font-weight: 400; color: var(--muted); }
      .thermo { margin: 6px 0 8px; }
      .thermo-track {
        position: relative; height: 8px; border-radius: 99px;
        background: linear-gradient(to right, var(--cold), var(--warm), var(--hot));
      }
      .thermo.tone-flat .thermo-track { background: var(--flat-soft); }
      .thermo-marker {
        position: absolute; top: -3px; width: 4px; height: 14px; border-radius: 2px;
        background: var(--fg); transform: translateX(-2px);
        box-shadow: 0 0 0 2px var(--card);
      }
      .thermo-scale {
        display: flex; justify-content: space-between;
        font-size: 10px; color: var(--muted); margin-top: 3px;
      }
      .facet { font-size: 12px; margin-top: 6px; }
      .facet-label { font-weight: 600; color: var(--muted); }
      .spread { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
      .chip {
        font-size: 10px; padding: 2px 6px; border-radius: 99px;
        border: 1px solid var(--border); color: var(--fg);
      }
      .chip.lean-left { background: var(--lean-left); }
      .chip.lean-right { background: var(--lean-right); }
      .chip.lean-center { background: var(--lean-center); }
      .chip.lean-unclear { background: var(--flat-soft); }
      .caveat { font-size: 10px; color: var(--muted); margin-top: 4px; font-style: italic; }
      /* What went into the thermometer, in plain words. */
      .explain { margin: 6px 0 0; padding-left: 16px; font-size: 11px; color: var(--muted); }
      .explain li { margin: 1px 0; }
      .thermo.tone-quality .thermo-track { background: linear-gradient(to right, var(--flat-soft), var(--accent-soft)); }
      .chip.stance-supports { margin-left: 6px; background: var(--ok-soft); }
      .chip.stance-contradicts { margin-left: 6px; background: var(--rating-false); }
      .factchecks {
        margin-top: 10px; padding: 8px 10px; border-radius: 6px;
        background: var(--ok-soft); border: 1px solid var(--border);
      }
      .scholar {
        margin-top: 10px; padding: 8px 10px; border-radius: 6px;
        background: var(--lean-left); border: 1px solid var(--border);
      }
      .chip.academic { margin-left: 6px; background: var(--lean-left); }
      .fc-head { font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
      .factcheck { margin-bottom: 8px; }
      .factcheck:last-child { margin-bottom: 0; }
      .factcheck a { color: var(--link); text-decoration: none; font-weight: 500; }
      .factcheck a:hover { text-decoration: underline; }
      .rating {
        display: inline-block; margin-right: 6px; padding: 1px 6px; border-radius: 99px;
        font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em;
      }
      .rating.tone-false { background: var(--rating-false); }
      .rating.tone-true { background: var(--rating-true); }
      .rating.tone-mixed { background: var(--rating-mixed); }
      .rating.tone-unknown { background: var(--flat-soft); }
      .disclaimer {
        padding: 10px 12px 16px; font-size: 11px; line-height: 1.45;
        color: var(--muted); border-top: 1px solid var(--border);
      }
      button.check:hover:not(:disabled) { filter: brightness(1.1); }
      button.check:disabled { opacity: 0.6; cursor: default; }
      button.link { background: none; border: none; color: var(--link); cursor: pointer; padding: 0; font: inherit; text-decoration: underline; }
      button.icon {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--fg);
        border-radius: 5px;
        padding: 3px 8px;
        font-size: 12px;
        cursor: pointer;
      }
      button.icon:disabled { opacity: 0.55; cursor: default; }
    </style>
  </head>
  <body>
    <header>
      <h1>FactCheck</h1>
      <label class="toggle">
        <input type="checkbox" id="autocheck" />
        Auto-check
      </label>
      <button id="rescan" class="icon" title="Read this page again with the current settings">
        Rescan
      </button>
    </header>
    <div class="findbar" id="findbar" hidden>
      <button id="prev" title="Previous claim (Alt+Shift+P)" aria-label="Previous claim">&#9650;</button>
      <button id="next" title="Next claim (Alt+Shift+N)" aria-label="Next claim">&#9660;</button>
      <span id="counter">0 of 0</span>
      <span class="findhint">on this page</span>
    </div>
    <div class="siterow" id="site" hidden>
      <span class="site-name" id="siteName"></span>
      <button id="siteAllow" class="thumb" title="Always scan this site">&#128077;</button>
      <button id="siteBlock" class="thumb" title="Never scan this site">&#128078;</button>
    </div>
    <div class="siterow" id="keeprow">
      <button id="addSource" class="check secondary" title="Keep this page in your works cited list">Add this page as a source</button>
      <span class="keep-note" id="keepNote"></span>
    </div>
    <div class="banner" id="banner" hidden></div>
    <main id="feed"><div class="empty">Nothing flagged yet on this page.<br>Highlight a sentence, then right-click it and choose "Fact-check the highlighted text".</div></main>
    <footer class="disclaimer">
      A cross-checking aid, not a verdict. Flagging does not mean a claim is false,
      and AI summaries can be wrong. Read the sources.
      <button class="link" id="guideLink">How to use this</button>
    </footer>
    <script type="module" src="panel.js"></script>
  </body>
</html>
