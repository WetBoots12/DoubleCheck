<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>FactCheck</title>
    <style>
      /* Colors live in variables so light/dark can't be broken by rule order. */
      :root {
        color-scheme: light dark;
        --bg: #faf9f7;
        --fg: #1c1b19;
        --card: #ffffff;
        --border: #e5e2db;
        --muted: #6b675f;
        --link: #2f6ea8;
        --accent-soft: rgba(200, 150, 62, 0.16);
        --ok-soft: rgba(61, 122, 90, 0.18);
        --flat-soft: rgba(154, 154, 154, 0.2);
        --cold: #b4462d;
        --warm: #c8963e;
        --hot: #3d7a5a;
        --lean-left: rgba(66, 120, 190, 0.18);
        --lean-center: rgba(150, 150, 150, 0.18);
        --lean-right: rgba(190, 80, 70, 0.18);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16150f;
          --fg: #ece9e2;
          --card: #1f1e17;
          --border: #33312a;
          --muted: #a8a49a;
          --link: #7fb0dd;
          --accent-soft: rgba(200, 150, 62, 0.22);
          --ok-soft: rgba(127, 183, 154, 0.22);
          --flat-soft: rgba(200, 200, 200, 0.16);
          --cold: #d4694f;
          --warm: #d8ab55;
          --hot: #6aa88a;
          --lean-left: rgba(110, 160, 220, 0.22);
          --lean-center: rgba(180, 180, 180, 0.2);
          --lean-right: rgba(220, 120, 110, 0.22);
        }
      }
      body {
        margin: 0;
        font: 13px/1.5 system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      header {
        position: sticky; top: 0;
        display: flex; align-items: center; justify-content: space-between;
        gap: 8px; padding: 10px 12px;
        background: var(--card); color: var(--fg);
        border-bottom: 1px solid var(--border);
      }
      h1 { font-size: 13px; margin: 0; letter-spacing: 0.01em; color: var(--fg); }
      .toggle { display: flex; align-items: center; gap: 6px; font-size: 12px; }
      main { padding: 10px 12px 24px; }
      .claim {
        background: var(--card); color: var(--fg);
        border: 1px solid var(--border); border-radius: 8px;
        padding: 10px; margin-bottom: 10px;
      }
      .claim.fc-focused { outline: 2px solid #c8963e; }
      .claim-text { font-weight: 500; cursor: pointer; color: var(--fg); }
      .meta { display: flex; gap: 8px; align-items: center; margin-top: 6px; font-size: 11px; color: var(--muted); }
      .badge { padding: 1px 6px; border-radius: 99px; background: var(--accent-soft); color: var(--fg); }
      .badge.checked { background: var(--ok-soft); }
      .badge.error, .badge.noKey { background: var(--flat-soft); }
      .summary {
        margin-top: 8px; padding: 8px; border-radius: 6px;
        background: var(--accent-soft); color: var(--fg); font-size: 12px;
      }
      .result { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
      .result a { color: var(--link); text-decoration: none; font-weight: 500; }
      .result a:hover { text-decoration: underline; }
      .result .src { font-size: 11px; color: var(--muted); }
      .result .snip { font-size: 12px; color: var(--fg); opacity: 0.85; margin-top: 2px; }
      .empty { color: var(--muted); padding: 24px 4px; text-align: center; }
      .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
      .muted-note { font-size: 12px; color: var(--muted); font-style: italic; }
      button.check {
        padding: 5px 12px; font: inherit; font-size: 12px; font-weight: 500;
        cursor: pointer; border-radius: 6px;
        border: 1px solid var(--border); background: var(--accent-soft); color: var(--fg);
      }
      button.check.secondary { background: transparent; }

      /* Truth thermometer: how far the sources go toward supporting the claim. */
      .analysis { margin-top: 10px; }
      .verdict { font-weight: 600; font-size: 12px; display: flex; justify-content: space-between; gap: 8px; }
      .confidence { font-weight: 400; color: var(--muted); }
      .thermo { margin: 6px 0 8px; }
      .thermo-track {
        position: relative; height: 8px; border-radius: 99px;
        background: linear-gradient(to right, var(--cold), var(--warm), var(--hot));
      }
      .thermo.tone-flat .thermo-track { background: var(--flat-soft); }
      .thermo-marker {
        position: absolute; top: -3px; width: 4px; height: 14px; border-radius: 2px;
        background: var(--fg); transform: translateX(-2px);
        box-shadow: 0 0 0 2px var(--card);
      }
      .thermo-scale {
        display: flex; justify-content: space-between;
        font-size: 10px; color: var(--muted); margin-top: 3px;
      }
      .facet { font-size: 12px; margin-top: 6px; }
      .facet-label { font-weight: 600; color: var(--muted); }
      .spread { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
      .chip {
        font-size: 10px; padding: 2px 6px; border-radius: 99px;
        border: 1px solid var(--border); color: var(--fg);
      }
      .chip.lean-left { background: var(--lean-left); }
      .chip.lean-right { background: var(--lean-right); }
      .chip.lean-center { background: var(--lean-center); }
      .chip.lean-unclear { background: var(--flat-soft); }
      .caveat { font-size: 10px; color: var(--muted); margin-top: 4px; font-style: italic; }
      button.check:hover:not(:disabled) { filter: brightness(1.1); }
      button.check:disabled { opacity: 0.6; cursor: default; }
      button.link { background: none; border: none; color: var(--link); cursor: pointer; padding: 0; font: inherit; text-decoration: underline; }
    </style>
  </head>
  <body>
    <header>
      <h1>FactCheck</h1>
      <label class="toggle">
        <input type="checkbox" id="autocheck" />
        Auto-check
      </label>
    </header>
    <main id="feed"><div class="empty">Nothing flagged yet on this page.</div></main>
    <script type="module" src="panel.js"></script>
  </body>
</html>
